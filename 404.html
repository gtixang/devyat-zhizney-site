  <head>
    <meta charset="utf-8">
    <title>Девять жизней</title>
    <base href="/devyat-zhizney-site/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Помощь бездомным кошкам и собакам в Елабуге. Каталог животных, которым ищут дом, волонтёрство и способы помочь.">

    <!--
      Статичные OG-теги — сайт целиком клиентский рендеринг (без SSR/prerender),
      поэтому боты соцсетей (VK, Telegram, WhatsApp), которые не выполняют JS,
      увидят только то, что прописано прямо здесь, в исходном HTML. Кнопки
      "Поделиться" в футере (site-footer.component.ts) шарят window.location.origin
      (всегда адрес сайта, не текущую страницу) — этот статичный набор тегов
      полностью покрывает их сценарий. Динамические теги под конкретных животных
      здесь не нужны (см. обсуждение в чате: без пререндеринга по маршрутам их
      всё равно не увидят боты, а пререндер требует пересборки при каждом
      изменении в базе — отложено).
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Девять жизней">
    <meta property="og:title" content="Девять жизней — помощь бездомным кошкам и собакам">
    <meta property="og:description" content="Помогаем бездомным кошкам и собакам в Елабуге найти дом. Каталог животных, волонтёрство и способы помочь.">
    <meta property="og:image" content="https://devyat-zhizney.vercel.app/hero/hero-cat.jpg">
    <meta property="og:url" content="https://devyat-zhizney.vercel.app/">
    <meta property="og:locale" content="ru_RU">
    <meta name="twitter:card" content="summary_large_image">
    <!--
      Часть демонстрационных животных всё ещё использует временные фото с Unsplash
      (пока куратор не заменил их настоящими через админку — см. обсуждение в чате) —
      preconnect ускоряет самое первое обращение к этому хосту (Lighthouse
      Performance отметил "no origins were preconnected" в разборе LCP). Не вредит
      и после замены всех фото на свои: браузер просто не использует лишний
      preconnect, штрафа за него нет.
    -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <!--
      Стартовое значение (светлая тема) — @core/favicon переключает href в рантайме
      по prefers-color-scheme (см. docs/design-direction.md, раздел 21). И CSS
      media="..." на <link>, и @media внутри favicon-SVG ненадёжны в Chrome
      (работают в Firefox/Yandex, но не переоцениваются в Chrome) — единственный
      кросс-браузерный способ переключать фавиконку под тему браузера/ОС — JS.
    -->
    <link rel="icon" type="image/png" id="favicon" href="/devyat-zhizney-site/logo/logo-mark--ink.png">
